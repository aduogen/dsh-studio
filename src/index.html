<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH Studio</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span id="brand">DSH Studio</span>
      <input id="search" type="text" placeholder="搜卡片（标题 / 正文）" />
      <span id="status">正在启动内核…</span>
      <span class="spacer"></span>
      <button id="btn-batch">批量</button>
      <button id="btn-fit">1:1</button>
      <button id="btn-font-minus">A−</button>
      <button id="btn-font-reset">默认</button>
      <button id="btn-font-plus">A+</button>
      <button id="btn-lang">自动</button>
      <button id="btn-reload">刷新</button>
    </header>
    <main id="canvas-wrap">
      <div id="canvas"></div>
      <div id="empty" hidden>还没有会话</div>
      <aside id="panel" hidden></aside>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
