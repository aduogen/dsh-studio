        displayName: 服务器
        apiKeyEnv: ALIYUN_API_KEY
        api: openai-completions
        baseURL: https://a2a.zhongxian.xin/a2a/v1
        compat:
          supportsReasoningEffort: true
        models:
          - id: auto
            name: Auto
            contextWindow: 256000
            maxTokens: 32000
            reasoningEfforts:
              "off": none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: max
              max: max
          - id: hy3
            name: Hy3
            contextWindow: 192000
