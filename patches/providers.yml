- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      jojo:
        displayName: jojo
        apiKeyEnv: JOJO_API_KEY
        api: openai-responses
        baseURL: https://jojocode.com/v1
        models:
          - id: gpt-6.1-terra
            name: gpt-6.1-terra
          - id: gpt-6.1-sol
            name: gpt-6.1-sol
          - id: gpt-6-astra
            name: gpt-6-astra
      shangtang:
        displayName: 商汤
        apiKeyEnv: SHANGTANG_API_KEY
        api: openai-completions
        baseURL: https://token.sensenova.cn/v1
        compat:
          supportsReasoningEffort: true
        models:
          - id: deepseek-v4-flash
            name: deepseek-v4-flash
            contextWindow: 1048576
          - id: glm-5.2
            name: glm-5.2
            contextWindow: 1048576
          - id: sensenova-6.8-flash-lite
            name: sensenova-6.8-flash-lite
            contextWindow: 262144
            maxTokens: 65536
            input: [ text, image ]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
          - id: sensenova-6.8-flash
            name: sensenova-6.8-flash
            contextWindow: 262144
            maxTokens: 65536
            input: [ text, image ]
